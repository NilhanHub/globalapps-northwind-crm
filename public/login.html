<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwind CRM · Sign in</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400,50;9..144,500,50;9..144,600,50;9..144,700,50&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F1E7;
  --surface: #FBF7F0;
  --surface-raised: #FFFFFFFD;
  --border-soft: #EAE1D0;
  --border-strong: #DDD3C0;
  --text-main: #2A2622;
  --text-muted: #6B6358;
  --text-faint: #998F80;
  --accent: #6E2030;
  --accent-strong: #561826;
  --accent-soft: #F4E2E7;
  --terracotta: #C76A48;
  --terracotta-deep: #A8532F;
  --success: #6F9A5B;
  --danger: #B8332A;
  --font-display: 'Fraunces', Georgia, serif;
  --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --radius-sm: 7px;
  --radius-md: 11px;
  --radius-lg: 16px;
  --shadow-modal: 0 32px 80px rgba(42,38,34,0.28), 0 8px 24px rgba(42,38,34,0.10);
  --shadow-card: 0 1px 2px rgba(42,38,34,0.04), 0 2px 6px rgba(42,38,34,0.04);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--text-main);
  background: var(--bg);
  display: grid;
  place-items: center;
  padding: 20px;
}
.login-card {
  background: var(--surface-raised);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  width: 100%;
  max-width: 400px;
  padding: 40px 36px 32px;
  animation: scale-in 0.3s var(--ease);
}
@keyframes scale-in { from { opacity: 0; transform: scale(0.96); } }
@keyframes fade-in { from { opacity: 0; } }
.login-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.login-brand-mark {
  width: 36px;
  height: 36px;
  background: var(--accent);
  color: white;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
}
.login-brand-text {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--text-main);
}
.login-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 28px;
}
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.form-group input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--text-main);
  background: white;
  outline: none;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.form-group input:focus {
  border-color: var(--terracotta);
  box-shadow: 0 0 0 3px rgba(199,106,72,0.2);
}
.form-group input::placeholder { color: var(--text-faint); }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 12px 20px;
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 600;
  border: 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s var(--ease);
}
.btn-primary {
  background: var(--terracotta);
  color: white;
}
.btn-primary:hover { background: var(--terracotta-deep); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.form-error {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  margin-bottom: 16px;
  background: #FDF0ED;
  border: 1px solid #E8C3BC;
  border-radius: var(--radius-sm);
  color: var(--danger);
  font-size: 13px;
  font-weight: 500;
}
.form-error.visible { display: flex; }
.login-hint {
  text-align: center;
  margin-top: 20px;
  font-size: 11.5px;
  color: var(--text-faint);
  font-family: var(--font-mono);
}
.login-footer {
  text-align: center;
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--border-soft);
  font-size: 11px;
  color: var(--text-faint);
  font-family: var(--font-mono);
}
.spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
.btn.loading .spinner { display: inline-block; }
.btn.loading .btn-text { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 480px) {
  .login-card { padding: 28px 20px 24px; }
  .login-brand-text { font-size: 19px; }
}
</style>
</head>
<body>
<div class="login-card" role="main" aria-labelledby="login-title">
  <div class="login-brand">
    <div class="login-brand-mark" aria-hidden="true">N</div>
    <div class="login-brand-text" id="login-title">Northwind</div>
  </div>
  <div class="login-subtitle">CRM · Sign in to continue</div>
  <div class="form-error" id="loginError" role="alert"></div>
  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required spellcheck="false" autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">
      <span class="btn-text">Sign in</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>
  </form>
  <div class="login-hint">Shared access · no personal accounts</div>
  <div class="login-footer">Northwind CRM v1</div>
</div>
<script>
const form = document.getElementById('loginForm');
const username = document.getElementById('username');
const password = document.getElementById('password');
const error = document.getElementById('loginError');
const btn = document.getElementById('loginBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  error.classList.remove('visible');
  btn.classList.add('loading');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username.value.trim(), password: password.value }),
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = '/';
    } else {
      error.textContent = data.error || 'Invalid credentials';
      error.classList.add('visible');
      password.value = '';
      password.focus();
    }
  } catch (err) {
    error.textContent = 'Connection error. Please try again.';
    error.classList.add('visible');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
