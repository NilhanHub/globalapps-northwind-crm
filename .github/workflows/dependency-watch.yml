name: Dependency watch

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-watch
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the reviewed dependency tree
        run: npm ci
      - name: Require a valid dependency tree
        run: npm ls --all
      - name: Require zero production vulnerabilities
        run: npm audit --omit=dev --audit-level=low
      - name: Validate exact development exceptions
        run: npm run audit:dependencies
      - name: Report the installed and latest Firebase CLI versions
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED="$(node -p "require('./package.json').devDependencies['firebase-tools']")"
          LATEST="$(npm view firebase-tools version)"
          {
            echo '## Firebase CLI dependency watch'
            echo
            echo "- Installed reviewed version: \`${INSTALLED}\`"
            echo "- Latest registry version: \`${LATEST}\`"
            echo '- Production vulnerability gate: passed'
            echo '- Exact exception policy: passed'
          } >> "$GITHUB_STEP_SUMMARY"
