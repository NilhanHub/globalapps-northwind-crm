name: Dependency watch

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-watch
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the reviewed dependency tree
        run: npm ci
      - name: Require a valid dependency tree
        run: npm ls --all
      - name: Validate exact dependency exceptions
        run: npm run audit:dependencies
      - name: Report dependency exception status
        shell: bash
        run: |
          set -euo pipefail
          node -e "const pkg=require('./package.json'); if (pkg.devDependencies && pkg.devDependencies['firebase-tools']) process.exit(1)"
          {
            echo '## Dependency watch'
            echo
            echo '- Firebase CLI is not installed in the root npm tree.'
            echo '- Firestore emulator tests prefer Google Cloud SDK and use an exact ephemeral Firebase CLI fallback only when needed.'
            echo '- Exact exception policy: passed.'
          } >> "$GITHUB_STEP_SUMMARY"
