name: Promote staging to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact staging commit SHA approved for production
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      approved-sha: ${{ steps.release.outputs.approved-sha }}
      main-sha: ${{ steps.release.outputs.main-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: staging
      - name: Validate the exact staging push release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main staging --prune
          STAGING_SHA="$(git rev-parse origin/staging)"
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$REQUESTED_SHA" = "$STAGING_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$STAGING_SHA"
          test -z "$(git status --porcelain)"

          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=staging&event=push&head_sha=${STAGING_SHA}&status=completed&per_page=20" --jq ".workflow_runs[] | select(.head_sha == \"${STAGING_SHA}\" and .conclusion == \"success\") | .id" | head -n 1)"
          test -n "$RUN_ID"
          JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '[.jobs[] | {name, conclusion}]')"
          node -e '
            const jobs = JSON.parse(process.argv[1]);
            for (const name of ["secrets", "verify", "staging-live"])
              if (!jobs.some((job) => job.name === name && job.conclusion === "success")) process.exit(1);
          ' "$JOBS"

          echo "approved-sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"
          echo "main-sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

  promote:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: staging
      - name: Promote by fast-forward only
        env:
          APPROVED_SHA: ${{ needs.validate.outputs.approved-sha }}
          VALIDATED_MAIN_SHA: ${{ needs.validate.outputs.main-sha }}
        run: |
          set -euo pipefail
          git fetch origin main staging --prune
          test "$(git rev-parse origin/staging)" = "$APPROVED_SHA"
          test "$(git rev-parse origin/main)" = "$VALIDATED_MAIN_SHA"
          git merge-base --is-ancestor "$VALIDATED_MAIN_SHA" "$APPROVED_SHA"
          git push --atomic \
            --force-with-lease=refs/heads/main:${VALIDATED_MAIN_SHA} \
            --force-with-lease=refs/heads/staging:${APPROVED_SHA} \
            origin \
            "${APPROVED_SHA}:refs/heads/main" \
            "${APPROVED_SHA}:refs/heads/staging"
      - name: Verify exact production deployment
        env:
          APPROVED_SHA: ${{ needs.validate.outputs.approved-sha }}
        run: node scripts/verify-live-release.mjs https://crm.globalapps.world "$APPROVED_SHA" 75 15
