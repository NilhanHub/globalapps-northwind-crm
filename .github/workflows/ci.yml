name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:firestore-emulator
      - run: npm run audit:dependencies
      - run: npm ci --prefix infra/functions/backup-verifier --ignore-scripts
      - run: npm audit --prefix infra/functions/backup-verifier --audit-level=moderate
      - run: npm run build
      - run: npm run verify:artifacts
      - run: npm run test:e2e
  staging-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [secrets, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify exact staging deployment
        run: node scripts/verify-live-release.mjs https://crm-staging.globalapps.world "$GITHUB_SHA" 60 15
