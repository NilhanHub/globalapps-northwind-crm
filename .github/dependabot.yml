version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Colombo
